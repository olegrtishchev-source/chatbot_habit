[tool.poetry]
name = "chatbot-habit"
version = "0.1.0"
description = "Telegram-бот для трекинга привычек — практикум Skillbox"
authors = ["Oleg Rtishchev"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
sqlalchemy = "^2.0"
alembic = "^1.14"
psycopg2-binary = "^2.9"
pydantic = "^2.9"
pydantic-settings = "^2.6"
python-dotenv = "^1.0"
pytelegrambotapi = "^4.24"
pyjwt = "^2.10"
apscheduler = "^3.11"
httpx = "^0.27"
passlib = {extras = ["bcrypt"], version = "^1.7"}

[tool.poetry.group.dev.dependencies]
ruff = "^0.8"
mypy = "^1.13"
pytest = "^8.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
